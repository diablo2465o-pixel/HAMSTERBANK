


<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>HAMSTER BANK | Ultimate UI</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { 
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%); 
            color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        .calc-card { 
            background: #11100f; border: 1px solid #1f1d1c; border-radius: 40px; 
            width: 1100px; padding: 60px; 
            display: grid; 
            /* ГЛАВНОЕ ИЗМЕНЕНИЕ: Лево — 2 части, Право — 1 часть (делаем поля шире) */
            grid-template-columns: 2fr 1fr; 
            gap: 40px; position: relative; box-shadow: 0 50px 100px rgba(0,0,0,0.8);
        }

        .tabs { position: absolute; top: 40px; right: 60px; display: flex; gap: 10px; z-index: 10; }
        .tab { 
            padding: 10px 25px; border-radius: 12px; font-weight: 800; font-size: 12px; 
            color: #444; cursor: pointer; background: #151515; border: 1px solid #222;
        }
        .tab.active { background: #a3ff12; color: black; border-color: #a3ff12; }

        .left h1 { font-size: 55px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -2px; line-height: 1; margin-top: 20px; }
        .left h1 span { color: #a3ff12; }
        .sub { font-size: 9px; color: #222; font-weight: 900; margin-bottom: 40px; text-transform: uppercase; }

        /* Поля ввода теперь растягиваются */
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        label { display: block; font-size: 9px; color: #222; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; }
        input { 
            width: 100%; background: #0a0908; border: 1px solid #1a1817; border-radius: 15px; 
            padding: 20px; color: white; font-weight: 700; font-size: 16px; outline: none;
        }

        /* ПРАВАЯ ПАНЕЛЬ СТАЛА КОМПАКТНЕЕ */
        .right-panel { 
            background: #0a0908; border: 1px solid #161514; border-radius: 30px; 
            padding: 30px; /* Уменьшил внутренние отступы */
            display: flex; flex-direction: column; justify-content: space-between;
            margin-top: 50px; height: calc(100% - 50px);
            max-width: 320px; /* Ограничил ширину, чтобы не была огромной */
        }

        .stats-top { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .stat-item span { font-size: 8px; color: #2a2827; font-weight: 900; display: block; margin-bottom: 10px; }
        .stat-item b { font-size: 14px; font-weight: 900; } /* Чуть уменьшил текст */

        .total-area { margin-top: auto; padding-top: 20px; }
        /* Ноль теперь не такой гигантский, чтобы влезть в узкую панель */
        .total-area h2 { font-size: 70px; font-weight: 900; color: #a3ff12; line-height: 0.8; margin-top: 10px; }

        .btn-main { 
            background: #a3ff12; color: black; border: none; padding: 20px; 
            border-radius: 15px; font-weight: 900; font-size: 13px; text-transform: uppercase; 
            cursor: pointer; margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="calc-card">
        <div class="tabs">
            <div id="tc" class="tab active" onclick="m('c')">Кредит</div>
            <div id="tv" class="tab" onclick="m('v')">Вклад</div>
        </div>

        <div class="left">
            <h1 id="h">Расчет <span>кредита</span></h1>
            <div class="sub">СИСТЕМА МОМЕНТАЛЬНОГО ОБСЛУЖИВАНИЯ HAMSTER BANK.</div>

            <div class="row">
                <div><label>Никнейм</label><input type="text" id="nick" placeholder="Введите ник"></div>
                <div><label>Discord ID</label><input type="text" id="discord" placeholder="Ваш ID"></div>
            </div>

            <label id="ls">Сумма кредита</label>
            <input type="number" id="s" placeholder="Введите сумму" style="margin-bottom: 15px;" oninput="c()">

            <div class="row">
                <div><label>Срок (дни)</label><input type="number" id="d" placeholder="Укажите срок" oninput="c()"></div>
                <div><label>Промокод</label><input type="text" placeholder="Если есть"></div>
            </div>
        </div>

        <div class="right-panel">
            <div class="stats-top">
                <div class="stat-item"><span>СТАВКА</span><b id="rate">50% / МЕС.</b></div>
                <div class="stat-item" style="text-align: right;"><span>ПЕРЕПЛАТА</span><b id="over" style="color: #a3ff12">+ $0</b></div>
            </div>
            <div class="total-area">
                <label id="lr" style="font-size: 9px; color:#222; font-weight:900;">К ВОЗВРАТУ:</label>
                <h2 id="total">$0</h2>
            </div>
            <button class="btn-main" onclick="sendToDiscord()">Оформить заявку →</button>
        </div>
    </div>

    <script>
        let md = 'c';
        // ТВОЙ ВЕБХУК УЖЕ ТУТ
        const webhookURL = "https://discordapp.com";

        function m(v) {
            md = v;
            document.getElementById('tc').classList.toggle('active', v === 'c');
            document.getElementById('tv').classList.toggle('active', v === 'v');
            document.getElementById('h').innerHTML = v === 'c' ? 'Расчет <span>кредита</span>' : 'Расчет <span>вклада</span>';
            document.getElementById('ls').innerText = v === 'c' ? 'Сумма кредита' : 'Сумма вклада';
            document.getElementById('lr').innerText = v === 'c' ? 'К ВОЗВРАТУ:' : 'ИТОГО С ПРИБЫЛЬЮ:';
            document.getElementById('rate').innerText = v === 'c' ? '50% / МЕС.' : '25% / МЕС.';
            c();
        }

        function c() {
            let s = document.getElementById('s').value || 0;
            let d = document.getElementById('d').value || 0;
            let r = (md === 'c') ? 0.0166 : 0.0083;
            let o = Math.floor(s * r * d);
            document.getElementById('over').innerText = '+ $' + o;
            document.getElementById('total').innerText = '$' + (s > 0 ? (Number(s) + o) : 0);
        }

        async function sendToDiscord() {
            const nick = document.getElementById('nick').value;
            const discordID = document.getElementById('discord').value;
            const sum = document.getElementById('s').value;
            const days = document.getElementById('d').value;
            const total = document.getElementById('total').innerText;

            if (!nick || !sum || !days) {
                alert("Заполни все поля!");
                return;
            }

            const message = {
                embeds: [{
                    title: `🐹 Новая заявка: ${md === 'c' ? 'КРЕДИТ' : 'ВКЛАД'}`,
                    color: 10747666,
                    fields: [
                        { name: "👤 Ник", value: nick, inline: true },
                        { name: "🆔 Discord ID", value: discordID, inline: true },
                        { name: "💰 Сумма", value: `${sum}$`, inline: true },
                        { name: "📅 Срок", value: `${days} дн.`, inline: true },
                        { name: "💵 Итого", value: total, inline: false }
                    ],
                    footer: { text: "Hamster Bank System" }
                }]
            };

            try {
                await fetch(webhookURL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(message) });
                alert("Заявка отправлена!");
            } catch (e) {
                alert("Ошибка отправки.");
            }
        }
    </script>
</body>
</html>
